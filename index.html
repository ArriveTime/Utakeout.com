<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utakeout.com - Skip the Fees, Skip the Line</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* Base Reset & Variables */
        :root {
            --primary: #0f172a;
            --accent: #d4af37;
            --accent-hover: #b89528;
            --bg-light: #f8f9fa;
            --card-bg: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* Hero Header with Background & Dark Gradient Overlay */
        .hero {
            position: relative;
            width: 100%;
            height: 65vh;
            min-height: 440px;
            background: linear-gradient(rgba(15, 23, 42, 0.70), rgba(15, 23, 42, 0.70)), 
                        url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
            padding: 0 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        .hero-logo {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(2.8rem, 6vw, 5.2rem);
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
        }

        .hero-divider {
            width: 90px;
            height: 3px;
            background-color: var(--accent);
            margin: 16px 0;
            border-radius: 2px;
        }

        .hero-tagline {
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #f1f5f9;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        }

        /* Controls Section (Search & Filters) */
        .controls-wrapper {
            max-width: 1200px;
            margin: -35px auto 40px auto;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .controls-card {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 16px;
            align-items: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .control-input, .control-select {
            width: 100%;
            padding: 12px 16px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .control-input:focus, .control-select:focus {
            border-color: var(--accent);
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto 60px auto;
            padding: 0 20px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        .results-count {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        /* Restaurant Cards Grid */
        .restaurant-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
        }

        .card-img-wrapper {
            position: relative;
            width: 100%;
            height: 210px;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .card-img {
            transform: scale(1.05);
        }

        .rating-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(15, 23, 42, 0.85);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            backdrop-filter: blur(4px);
        }

        .card-content {
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.4rem;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .card-cuisine {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--accent);
            margin-bottom: 12px;
            font-weight: 700;
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .card-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn-order {
            flex: 1;
            text-align: center;
            background-color: var(--primary);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
        }

        .btn-order:hover {
            background-color: var(--accent);
            color: var(--primary);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: #f1f5f9;
            color: var(--primary);
        }

        /* Empty State */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        /* Modal Overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.75);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 1.5rem;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 20px;
            background-color: var(--primary);
            color: #94a3b8;
            font-size: 0.9rem;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        /* Responsive Tweaks */
        @media (max-width: 768px) {
            .controls-card {
                grid-template-columns: 1fr;
            }
            .hero {
                height: 50vh;
            }
        }
    </style>
</head>
<body>

    <!-- Hero Header Section -->
    <header class="hero">
        <h1 class="hero-logo">Utakeout.com</h1>
        <div class="hero-divider"></div>
        <p class="hero-tagline">Skip the Fees &mdash; Skip the Line</p>
    </header>

    <!-- Controls (Search & Filtering) -->
    <section class="controls-wrapper">
        <div class="controls-card">
            <div class="input-group">
                <label for="searchInput">Search Restaurant or Cuisine</label>
                <input type="text" id="searchInput" class="control-input" placeholder="e.g. Pasta, Sushi, Steakhouse...">
            </div>
            <div class="input-group">
                <label for="cuisineFilter">Category</label>
                <select id="cuisineFilter" class="control-select">
                    <option value="all">All Cuisines</option>
                    <option value="Italian">Italian</option>
                    <option value="Japanese">Japanese</option>
                    <option value="American">American</option>
                    <option value="Mexican">Mexican</option>
                    <option value="Thai">Thai</option>
                    <option value="French">French</option>
                    <option value="Indian">Indian</option>
                    <option value="Seafood">Seafood</option>
                </select>
            </div>
            <div class="input-group">
                <label for="sortBy">Sort By</label>
                <select id="sortBy" class="control-select">
                    <option value="rating">Highest Rated</option>
                    <option value="name">Name (A-Z)</option>
                </select>
            </div>
        </div>
    </section>

    <!-- Main Directory Content -->
    <main class="container">
        <div class="results-header">
            <h2 class="section-title" style="font-family:'Playfair Display', serif;">Direct Ordering Directory</h2>
            <div class="results-count" id="resultsCount">Showing 0 Restaurants</div>
        </div>

        <div class="restaurant-grid" id="restaurantGrid">
            <!-- Dynamic JavaScript Content Will Render Here -->
        </div>
    </main>

    <!-- Info Modal -->
    <div class="modal" id="infoModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h3 id="modalTitle" style="font-family:'Playfair Display', serif; margin-bottom:12px;"></h3>
            <p id="modalBody" style="color:var(--text-muted); font-size:0.95rem; line-height:1.6; margin-bottom:20px;"></p>
            <a id="modalLink" href="#" target="_blank" rel="noopener" class="btn-order" style="display:inline-block;">Go to Official Website</a>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 <strong>Utakeout.com</strong>. All rights reserved.</p>
        <p style="margin-top: 8px; font-size: 0.8rem;">Supporting local restaurants with direct ordering without third-party commission fees.</p>
    </footer>

    <!-- JavaScript Data & Engine -->
    <script>
        // Full Dataset - All links point DIRECTLY to official websites, NOT Google Search
        const restaurants = [

            {

            {

                cuisine: "Japanese",

                phone: "(555) 901-2346",

                image: "https://images.unsplash.com/photo-1514933651103-005eec06c04b?auto=format&fit=crop&w=600&q=80",
                website: "https://www.gatsu-gatsu.com"
            },
            {
                id: 11,
                name: "Smokehouse BBQ Yard",
                cuisine: "American",
                rating: 4.8,
                address: "900 Industrial Pkwy, Southside",
                phone: "(555) 012-3456",
                desc: "Slow-smoked brisket, Saint Louis ribs, pulled pork, and signature house-made barbecue sauces.",
                image: "https://images.unsplash.com/photo-1529193591184-b1d58069ecdd?auto=format&fit=crop&w=600&q=80",
                website: "https://www.famousdaves.com"
            },
            {
                id: 12,
                name: "Guadalajara Cantina",
                cuisine: "Mexican",
                rating: 4.5,
                address: "410 Elm Street, Westside",
                phone: "(555) 123-4567",
                desc: "Sizzling fajita platters, cheesy enchiladas, and traditional Mexican desserts like churros.",
                image: "https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=600&q=80",
                website: "https://www.chevys.com"
            }
        ];

        // Render Cards to Page
        function renderDirectory(data) {
            const grid = document.getElementById('restaurantGrid');
            const countLabel = document.getElementById('resultsCount');
            
            grid.innerHTML = '';
            countLabel.textContent = `Showing ${data.length} Restaurant${data.length === 1 ? '' : 's'}`;

            if (data.length === 0) {
                grid.innerHTML = `
                    <div class="no-results">
                        <h3>No matching restaurants found</h3>
                        <p>Try adjusting your search terms or filters above.</p>
                    </div>
                `;
                return;
            }

            data.forEach(item => {
                const card = document.createElement('article');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${item.image}" alt="${item.name}" class="card-img">
                        <div class="rating-badge">&#9733; ${item.rating}</div>
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${item.name}</h3>
                        <p class="card-cuisine">${item.cuisine}</p>
                        <p class="card-desc">${item.desc}</p>
                        <div class="card-meta">
                            <span><strong>Address:</strong> ${item.address}</span>
                            <span><strong>Phone:</strong> ${item.phone}</span>
                        </div>
                        <div class="btn-group">
                            <a href="${item.website}" target="_blank" rel="noopener" class="btn-order">Official Website</a>
                            <button onclick="openModal('${item.name}', '${item.desc}', '${item.address}', '${item.phone}', '${item.website}')" class="btn-order btn-secondary">Details</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Filtering and Search Logic
        function filterData() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const selectedCuisine = document.getElementById('cuisineFilter').value;
            const sortBy = document.getElementById('sortBy').value;

            let filtered = restaurants.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(searchTerm) || 
                                      item.cuisine.toLowerCase().includes(searchTerm) ||
                                      item.desc.toLowerCase().includes(searchTerm);
                
                const matchesCuisine = selectedCuisine === 'all' || item.cuisine === selectedCuisine;

                return matchesSearch && matchesCuisine;
            });

            // Sorting
            if (sortBy === 'rating') {
                filtered.sort((a, b) => b.rating - a.rating);
            } else if (sortBy === 'name') {
                filtered.sort((a, b) => a.name.localeCompare(b.name));
            }

            renderDirectory(filtered);
        }

        // Modal Functionality
        function openModal(name, desc, address, phone, link) {
            document.getElementById('modalTitle').textContent = name;
            document.getElementById('modalBody').innerHTML = `
                <p style="margin-bottom:12px;">${desc}</p>
                <p><strong>Location:</strong> ${address}</p>
                <p><strong>Direct Phone:</strong> ${phone}</p>
            `;
            const linkBtn = document.getElementById('modalLink');
            linkBtn.href = link;
            document.getElementById('infoModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('infoModal').style.display = 'none';
        }

        // Event Listeners
        document.getElementById('searchInput').addEventListener('input', filterData);
        document.getElementById('cuisineFilter').addEventListener('change', filterData);
        document.getElementById('sortBy').addEventListener('change', filterData);

        window.onclick = function(event) {
            const modal = document.getElementById('infoModal');
            if (event.target === modal) {
                closeModal();
            }
        };

        // Initial Load
        filterData();
    </script>
</body>
